services:
  tryon-engine:
    build:
      context: ./backend-python
    ports:
      - "8000:8000"

  api:
    build:
      context: ./backend-dotnet/VirtualTryOn.Api
    environment:
      - TryOnEngine__BaseUrl=http://tryon-engine:8000
    ports:
      - "5000:5000"
    depends_on:
      - tryon-engine

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - api

